name: Bug report
description: Report reproducible incorrect behavior in TBR.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the smallest reliable set of steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, browser version, operating system, and deployed or local URL.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add screenshots, console output, or relevant WebMCP call details.

